version: "3.9"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar123}@postgres:5432/${POSTGRES_DB:-radar_contratos}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-dev_secret_key}
    PYTHONPATH: /opt/airflow
    _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_ADDITIONAL_REQUIREMENTS:-apache-airflow-providers-amazon==8.25.0 requests==2.32.3 boto3==1.35.36 psycopg2-binary==2.9.9}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
    LAKE_BUCKET: ${MINIO_LAKE_BUCKET:-radar-lake}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./src:/opt/airflow/src
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: radar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar_contratos}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar123}
      TZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_contratos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: radar-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: radar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123};
      mc mb -p local/${MINIO_LAKE_BUCKET:-radar-lake} || true;
      mc anonymous set private local/${MINIO_LAKE_BUCKET:-radar-lake} || true;
      exit 0;
      "

  airflow-init:
    <<: *airflow-common
    container_name: radar-airflow-init
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username ${AIRFLOW_ADMIN_USERNAME:-admin} --firstname Radar --lastname Admin --role Admin --email ${AIRFLOW_ADMIN_EMAIL:-admin@local} --password ${AIRFLOW_ADMIN_PASSWORD:-admin}"

  airflow-webserver:
    <<: *airflow-common
    container_name: radar-airflow-webserver
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_PORT:-8081}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: radar-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    image: python:3.11-slim
    container_name: radar-streamlit
    working_dir: /app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./streamlit_app:/app
    command: >
      /bin/sh -c "pip install --no-cache-dir streamlit duckdb pandas pyarrow s3fs &&
      streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
